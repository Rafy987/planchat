# Runs on every push and pull request. No secrets needed: tests use a throwaway
# Postgres + pgvector database inside CI, and the LLM is faked in tests.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      # A fresh database just for this run, same versions as Neon (Postgres 18, pgvector 0.8.6).
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: planchat
          POSTGRES_PASSWORD: planchat
          POSTGRES_DB: planchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planchat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://planchat:planchat@localhost:5432/planchat
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      # The embedding model (~70 MB) is downloaded once and reused by later runs.
      - uses: actions/cache@v6
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker:
    name: Docker image (build + start + health check)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: planchat
          POSTGRES_PASSWORD: planchat
          POSTGRES_DB: planchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planchat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t planchat-api .
      - name: Start the container like Render would (PORT is set by the platform)
        run: |
          docker run -d --name api --network host \
            -e PORT=8000 \
            -e DATABASE_URL=postgresql://planchat:planchat@localhost:5432/planchat \
            planchat-api
      - name: Wait for /health
        run: |
          for i in $(seq 60); do
            if curl -sf http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
      - name: Memory used (must stay well under Render's 512 MB)
        run: 'docker stats --no-stream --format "{{.Name}} uses {{.MemUsage}}" api'
